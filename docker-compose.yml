services:
  db:
    container_name: portfolio-service-db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quote-db}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - quote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quote} -d ${POSTGRES_DB:-quote-db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: portfolio-service-app
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-quote}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quote-db}?sslmode=disable
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service-app:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - abuamar-net

networks:
  abuamar-net:
    external: true

volumes:
  quote-pgdata:
    name: quote-pgdata
